language: samarium
version: '0.3.1'
aliases: [sm]
build: |
    # --- inlined from the former python/3.10.0 package ---

    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build

    curl "https://www.python.org/ftp/python/3.10.0/Python-3.10.0.tgz" -o python.tar.gz
    tar xzf python.tar.gz --strip-components=1
    rm python.tar.gz

    ./configure --prefix "$PREFIX" --with-ensurepip=install
    make -j$(nproc)
    make install -j$(nproc)

    cd ..

    rm -rf build

    bin/pip3 install numpy scipy pandas pycrypto whoosh bcrypt passlib sympy xxhash base58 cryptography PyNaCl
    # --- end of python/3.10.0 ---
    bin/pip3 install https://github.com/samarium-lang/Samarium/archive/refs/tags/0.3.1.zip

env:
    PATH: '{pkgdir}/bin:{PATH}'
run: |
    python3 -m samarium $1
test:
    language: sm
    expect: OK
    source: |
        => * {
            "OK"!;
        }
