language: paradoc
version: '0.6.0'
aliases: [paradoc]
build: |
    # --- inlined from the former python/3.9.1 package ---

    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build

    curl "https://www.python.org/ftp/python/3.9.1/Python-3.9.1.tgz" -o python.tar.gz
    tar xzf python.tar.gz --strip-components=1
    rm python.tar.gz

    ./configure --prefix "$PREFIX" --with-ensurepip=install
    make -j$(nproc)
    make install -j$(nproc)

    cd ..

    rm -rf build 

    bin/pip3 install --prefer-binary numpy scipy pandas pycrypto whoosh bcrypt passlib
    # --- end of python/3.9.1 ---

    git clone -q https://github.com/betaveros/paradoc.git paradoc

env_script: |
    export PYTHONPATH=$PYTHONPATH:$PWD/paradoc
    export PATH=$PWD/bin:$PATH
run: |
    # Paradoc only takes filename and stdin
    python3 -m paradoc "$1"
test:
    language: paradoc
    expect: OK
    source: '"OK"'
