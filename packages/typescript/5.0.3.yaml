language: typescript
version: '5.0.3'
aliases: [ts, node-ts, tsc, typescript5, ts5]
build: |
    # --- inlined from the former node/18.15.0 package ---
    curl "https://nodejs.org/dist/v18.15.0/node-v18.15.0-linux-x64.tar.xz" -o node.tar.xz
    tar xf node.tar.xz --strip-components=1
    rm node.tar.xz
    # --- end of node/18.15.0 ---

    # The env: block replaced the environment file the old layout had, so
    # export what this build needs directly: npm below runs from the node
    # inlined above.
    export PATH=$PWD/bin:$PATH

    bin/npm install -g typescript@5.0.3

env:
    PATH: '{pkgdir}/bin:{PATH}'
compile: |
    # Put instructions to compile source code, remove this file if the language does not require this stage

    rename 's/$/\.ts/' "$@" # Add .ts extension

    tsc *.ts
run: |
    # Put instructions to run the runtime

    CODE=$1.js
    shift

    node $CODE "$@"
test:
    language: ts
    expect: OK
    source: |
        console.log('OK');
