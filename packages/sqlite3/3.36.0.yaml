language: sqlite3
version: '3.36.0'
aliases: [sqlite, sql]
build: |
    PREFIX=$(realpath $(dirname $0))

    curl https://www.sqlite.org/2021/sqlite-amalgamation-3360000.zip -o sqlite.zip
    unzip -q sqlite.zip
    rm -rf sqlite.zip

    gcc -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION sqlite-amalgamation-3360000/shell.c sqlite-amalgamation-3360000/sqlite3.c -o sqlite3

    rm -rf sqlite-amalgamation-3360000
env:
    PATH: '{pkgdir}:{PATH}'
run: |
    code=`cat "$1"`

    shift

    argv_text=""

    for arg in "$@"
    do
        argv_text+='insert into argv (arg) values ("'"`echo "$arg" | sed 's/"/""/g'`"'");
    '
    done


    sqlite3 <<< "create table argv (arg text); 
    $argv_text
    $code"
test:
    language: sql
    expect: OK
    source: |
        SELECT 'OK';
