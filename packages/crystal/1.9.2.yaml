language: crystal
version: '1.9.2'
aliases: [crystal, cr]
build: |
    PREFIX=$(realpath $(dirname $0))

    curl -L "https://github.com/crystal-lang/crystal/releases/download/1.9.2/crystal-1.9.2-1-linux-x86_64.tar.gz" -o crystal.tar.gz
    tar xzf crystal.tar.gz --strip-components=1
    rm crystal.tar.gz
env:
    PATH: '{pkgdir}/bin:{PATH}'
compile: |
    # Compile crystal files into out file
    crystal build "$@" -o out --no-color && \
    chmod +x out
run: |
    shift # Filename is only used to compile
    ./out "$@"
test:
    language: cr
    expect: OK
    source: puts("OK")
