language: ocaml
version: '4.12.0'
aliases: [ocaml, ml]
build: |
    PREFIX=$(realpath $(dirname $0))

    mkdir -p build
    cd build

    curl -L "https://github.com/ocaml/ocaml/archive/4.12.0.tar.gz" -o ocaml.tar.gz
    tar xzf ocaml.tar.gz --strip-components=1
    rm ocaml.tar.gz

    ./configure --prefix="$PREFIX"
    make -j$(nproc)
    make install -j$(nproc)

    cd ..
    rm -rf build
env:
    PATH: '{pkgdir}/bin:{PATH}'
compile: |
    rename 's/$/\.ml/' "$@" # Add .ml extension

    ocamlc -o out *.ml
run: |
    shift
    ./out "$@"
test:
    language: ml
    expect: OK
    source: |
        print_string "OK\n";
