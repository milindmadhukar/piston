language: pascal
version: '3.2.2'
aliases: [freepascal, pp, pas]
build: |
    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build
    curl -L "https://sourceforge.net/projects/freepascal/files/Linux/3.2.2/fpc-3.2.2.x86_64-linux.tar/download"  -o pascal.tar
    tar xf pascal.tar --strip-components=1

    # FreePascal uses an interactive installer
    ./install.sh << ANSWERS
    $PREFIX
    n
    n
    n
    ANSWERS

    cd ..
    rm -rf build

    # fpc needs an fpc.cfg to compile anything. The vendor installer writes one
    # to /etc, which needs root - builds run unprivileged, so it was never there
    # and the copy failed silently. fpcmkcfg generates the same file, which is
    # what it exists for.
    mkdir -p lib/fpc/etc
    bin/fpcmkcfg -d "basepath=$PREFIX/lib/fpc/3.2.2" -o lib/fpc/etc/fpc.cfg
env:
    PATH: '{pkgdir}/bin:{PATH}'
compile: |
    # Compile pascal files
    fpc -oout -v0 "$@"
    chmod +x out
run: |
    shift # Filename is only used to compile
    ./out "$@"
test:
    language: pp
    expect: OK
    source: |
        program test;

            begin
                writeln('OK');
            end.
