language: ponylang
version: '0.39.0'
aliases: [pony, ponyc]
build: |
    PREFIX=$(realpath $(dirname $0))

    # get sources - only get the latest copy of the relevant files
    git clone -q https://github.com/ponylang/ponyc.git ponyc

    cd ponyc

    # release commit for 0.39.0
    git reset --hard 85d897b978c5082a1f3264a3a9ad479446d73984

    # DECnet is gone: Debian dropped linux/dn.h from linux-libc-dev, and
    # ponyc 0.39 still includes it unconditionally. Upstream removed the
    # include later; do the same here rather than pin an older libc-dev.
    #
    # Must come after the reset above, which is --hard and would otherwise
    # throw the edit away before anything is compiled.
    sed -i '/#include <linux\/dn.h>/d' src/libponyrt/lang/socket.c

    # updates all submodules recursively along their tracking branches
    # i.e. https://github.com/ponylang/ponyc/blob/main/.gitmodules
    git submodule update --recursive --init

    # ponyc's makefile defaults to `arch ?= native` and passes it straight
    # through as -march, so a build inherits whatever the machine that ran it
    # happened to support. These archives are built once in CI and installed
    # anywhere, so ponyc itself died with SIGILL - "Illegal instruction (core
    # dumped)" from `ponyc -b out` - on any host older than the runner.
    #
    # x86-64 is the baseline, and the images are linux/amd64 only. It has to be
    # passed to every target, not just the compile: the install target copies
    # libponyrt into lib/$(arch), so a mismatch loses the runtime libraries.
    # (tune already defaults to generic, and -mtune cannot emit instructions
    # the target lacks.)
    ARCH=x86-64

    # Build the vendored LLVM libraries that are included in the `lib/llvm/src`.
    make libs build_flags="-j$(nproc)"
    # Configure the CMake build directory.
    make configure arch="$ARCH"
    # Will build pony and put it in `build/release`.
    make build arch="$ARCH"
    # Install pony into `$PREFIX`.
    make prefix="$PREFIX" arch="$ARCH" install

    cd ..
    rm -rf ponyc
env:
    PATH: '{pkgdir}/bin:{PATH}'
compile: |
    # Compile pony file(s)
    rename 's/$/\.pony/' "$@" # Add .pony extension
    ponyc -b out
run: |
    # removes the first arg from $@, which is always the filename
    shift
    # runs the <outfile> executable with whatever args are left in $@
    ./out "$@"
test:
    language: pony
    expect: OK
    source: |
        actor Main
          new create(env: Env) =>
            env.out.print("OK")
