language: jelly
version: '0.1.31'
aliases: []
build: |
    # --- inlined from the former python/3.9.1 package ---

    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build

    curl "https://www.python.org/ftp/python/3.9.1/Python-3.9.1.tgz" -o python.tar.gz
    tar xzf python.tar.gz --strip-components=1
    rm python.tar.gz

    ./configure --prefix "$PREFIX" --with-ensurepip=install
    make -j$(nproc)
    make install -j$(nproc)

    cd ..

    rm -rf build 

    bin/pip3 install numpy scipy pandas pycrypto whoosh bcrypt passlib
    # --- end of python/3.9.1 ---

    mkdir -p build

    git clone -q https://github.com/DennisMitchell/jellylanguage.git build/jelly
    cd build/jelly
    ../../bin/python3.9 setup.py install --optimize=1

    cd ../../
    rm -rf build

env:
    PATH: '{pkgdir}/bin:{PATH}'
run: |
    jelly fu "$@"
test:
    language: jelly
    expect: OK
    source: “OK”
