language: jelly
version: '0.1.31'
aliases: []
build: |
    source ../../python/3.9.1/build.sh

    mkdir -p build

    git clone -q https://github.com/DennisMitchell/jellylanguage.git build/jelly
    cd build/jelly
    ../../bin/python3.9 setup.py install --optimize=1

    cd ../../
    rm -rf build
env:
    PATH: '{pkgdir}/bin:{PATH}'
run: |
    jelly fu "$@"
test:
    language: jelly
    expect: OK
    source: “OK”
