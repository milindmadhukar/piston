language: vyxal
version: '2.4.1'
aliases: []
build: |
    # get Python source
    # --- inlined from the former python/3.9.4 package ---

    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build

    curl "https://www.python.org/ftp/python/3.9.4/Python-3.9.4.tgz" -o python.tar.gz
    tar xzf python.tar.gz --strip-components=1
    rm python.tar.gz

    ./configure --prefix "$PREFIX" --with-ensurepip=install
    make -j$(nproc)
    make install -j$(nproc)

    cd ..

    rm -rf build 

    bin/pip3 install numpy scipy pandas pycrypto whoosh bcrypt passlib sympy
    # --- end of python/3.9.4 ---

    # add regex and pwn modules
    bin/pip3 install regex pwn

    # make vyxal directory
    mkdir vyxal
    cd vyxal

    # Vyxal install
    curl -L "https://github.com/Vyxal/Vyxal/archive/refs/tags/v2.4.1.tar.gz" -o vyxal.tar.xz
    tar xf vyxal.tar.xz --strip-components=1
    rm vyxal.tar.xz

    cd ..

env:
    PATH: '{pkgdir}/bin:{PATH}'
    VYXAL_PATH: '{pkgdir}/vyxal'
    TERM: xterm
run: |
    python3 "$VYXAL_PATH"/Vyxal.py "$1"
test:
    language: vyxal
    expect: OK
    source: '`OK'
