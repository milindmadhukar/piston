language: forte
version: '1.0.0'
aliases: [forter]
build: |
    # the forter interpreter requries ruby
    # --- inlined from the former ruby/3.0.1 package ---

    PREFIX=$(realpath $(dirname $0))

    mkdir -p build
    cd build

    # Download and extract ruby
    curl "https://cache.ruby-lang.org/pub/ruby/3.0/ruby-3.0.1.tar.gz" -o ruby.tar.gz
    tar xzf ruby.tar.gz --strip-components=1
    rm ruby.tar.gz

    # Autoconf based
    ./configure --prefix "$PREFIX"
    make -j$(nproc)
    make install -j$(nproc)

    #  Cleanup
    cd ..
    rm -rf build
    # --- end of ruby/3.0.1 ---

    mkdir -p build

    git clone -q "https://github.com/judofyr/forter" build/forter
    cd build/forter

    mv bin/* ../../bin/
    mv lib/* ../../lib/

    cd ../../
    rm -rf build

env:
    PATH: '{pkgdir}/bin:{PATH}'
run: |
    forter "$@"
test:
    language: forte
    expect: OK
    source: |
        1 PRINT "OK"
        2 END
