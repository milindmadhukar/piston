language: japt
version: '2.0.0'
aliases: [japt]
build: |
    # japt install
    # --- inlined from the former node/16.3.0 package ---
    curl "https://nodejs.org/dist/v16.3.0/node-v16.3.0-linux-x64.tar.xz" -o node.tar.xz
    tar xf node.tar.xz --strip-components=1
    rm node.tar.xz
    # --- end of node/16.3.0 ---

    git clone -q "https://github.com/Hydrazer/japt.git" japt

env:
    PATH: '{pkgdir}/bin:{PATH}'
    JAPT_PATH: '{pkgdir}/japt'
run: |
    # japt only takes filename and stdin
    node "$JAPT_PATH"/node.js "$1"
test:
    language: japt
    expect: OK
    source: '"OK'
