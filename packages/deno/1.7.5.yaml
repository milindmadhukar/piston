language: deno
version: '1.7.5'
provides:
    - language: typescript
      aliases: [deno-ts, deno]
    - language: javascript
      aliases: [deno-js]
build: |
    curl -L https://github.com/denoland/deno/releases/download/v1.7.5/deno-x86_64-unknown-linux-gnu.zip --output deno.zip
    unzip -o deno.zip
    rm deno.zip

    chmod +x deno
env:
    PATH: '{pkgdir}:{PATH}'
run: |
    DENO_DIR=$PWD NO_COLOR=true deno run "$@"
test:
    language: deno
    expect: OK
    source: |
        console.log('OK');
