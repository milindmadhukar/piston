language: deno
version: '1.16.2'
provides:
    - language: typescript
      aliases: [deno, deno-ts]
    - language: javascript
      aliases: [deno-js]
build: |
    curl -OL https://github.com/denoland/deno/releases/download/v1.16.2/deno-x86_64-unknown-linux-gnu.zip
    unzip -o deno-x86_64-unknown-linux-gnu.zip
    rm deno-x86_64-unknown-linux-gnu.zip
env:
    PATH: '{pkgdir}:{PATH}'
run: |
    DENO_DIR=$PWD NO_COLOR=true deno run $@
test:
    language: deno
    expect: OK
    source: |
        console.log('OK');
