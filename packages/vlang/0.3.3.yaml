language: vlang
version: '0.3.3'
aliases: [v]
build: |
    # Cloning vlang source
    git clone https://github.com/vlang/v
    cd v

    # Building and installing vlang
    make
env:
    PATH: '{pkgdir}/v:{PATH}'
run: |
    # Export environment variables
    export VMODULES="$PWD"
    export TMPDIR="$PWD"

    # Put instructions to run the runtime

    filename=$1

    rename 's/$/\.v/' $filename # Add .v extension

    shift
    v run $filename.v "$@"
test:
    language: v
    expect: OK
    source: |
        fn main() {
          println('OK')
        }
