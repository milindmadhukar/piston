language: raku
version: '6.100.0'
aliases: [raku, rakudo, perl6, p6, pl6]
build: |
    curl -L "https://rakudo.org/dl/rakudo/rakudo-moar-2021.05-01-linux-x86_64-gcc.tar.gz" -o raku.tar.xz
    tar xf raku.tar.xz --strip-components=1
    rm raku.tar.xz
env:
    PATH: '{pkgdir}/bin:{PATH}'
run: |
    raku "$@"
test:
    language: raku
    expect: OK
    source: say "OK"
