language: matl
version: '22.5.0'
aliases: []
build: |
    # build octave as dependency
    # --- inlined from the former octave/6.2.0 package ---

    # Build octave from source
    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build

    curl -L "https://ftp.gnu.org/gnu/octave/octave-6.2.0.tar.gz" -o octave.tar.gz

    tar xzf octave.tar.gz --strip-components=1

    # === autoconf based ===
    # Disable support for GUI, HDF5 and Java
    ./configure --prefix "$PREFIX" --without-opengl --without-qt --without-x --without-hdf5 --disable-java

    make -j$(nproc)
    make install -j$(nproc)

    cd ../
    rm -rf build
    # --- end of octave/6.2.0 ---

    # curl MATL 22.5.0
    curl -L "https://github.com/lmendo/MATL/archive/refs/tags/22.5.0.tar.gz" -o MATL.tar.xz
    tar xf MATL.tar.xz --strip-components=1
    rm MATL.tar.xz

env:
    PATH: '{pkgdir}/bin:{PATH}'
    MATL_PATH: '{pkgdir}'
run: |
    # get file as first argument
    file="$1"

    # remove the file from $@
    shift

    # use the rest of the arguments as stdin
    stdin=`printf "%s\n" "$@"`

    # pass stdin into octave which will run MATL
    echo "$stdin" | octave -W -p "$MATL_PATH" --eval "matl -of '$file'"
test:
    language: matl
    expect: OK
    source: "'OK'"
