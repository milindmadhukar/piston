language: node
version: '15.10.0'
provides:
    - language: javascript
      aliases: [node-javascript, node-js, javascript, js]
build: |
    curl "https://nodejs.org/dist/v15.10.0/node-v15.10.0-linux-x64.tar.xz" -o node.tar.xz
    tar xf node.tar.xz --strip-components=1
    rm node.tar.xz
env:
    PATH: '{pkgdir}/bin:{PATH}'
run: |
    node "$@"
test:
    language: js
    expect: OK
    source: |
        console.log('OK');
