language: bash
version: '5.1.0'
aliases: [sh]
build: |
    # Put instructions to build your package in here
    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build

    curl "https://ftp.gnu.org/gnu/bash/bash-5.1.tar.gz" -o bash.tar.gz

    tar xzf bash.tar.gz --strip-components=1

    # === autoconf based ===
    ./configure --prefix "$PREFIX"

    # Serial on purpose. bash's Makefile never declares that bashline.c needs
    # builtins/builtext.h, which the builtins subdirectory generates, so a
    # parallel build races to compile bashline.o before that header exists and
    # fails about half the time with "builtins/builtext.h: No such file or
    # directory". bash is small enough that -j buys little either way.
    make
    make install
    cd ../
    rm -rf build
env:
    PATH: '{pkgdir}/bin:{PATH}'
run: |
    # Put instructions to run the runtime
    bash "$@"
test:
    language: bash
    expect: OK
    source: echo "OK"
