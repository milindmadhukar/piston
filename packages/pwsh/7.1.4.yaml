language: pwsh
version: '7.1.4'
provides:
    - language: powershell
      aliases: [ps, pwsh, ps1]
build: |
    curl -L https://github.com/PowerShell/PowerShell/releases/download/v7.1.4/powershell-7.1.4-linux-x64.tar.gz -o powershell.tar.gz
    tar zxf powershell.tar.gz
    rm powershell.tar.gz

    chmod +x pwsh
env:
    PATH: '{pkgdir}:{PATH}'
run: |
    pwsh "$@"
test:
    language: ps1
    expect: OK
    source: |
        echo "OK"
