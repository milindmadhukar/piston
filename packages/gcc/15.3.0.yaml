language: gcc
version: '15.3.0'
provides:
    - language: c
      aliases: [gcc]
    - language: c++
      aliases: [cpp, g++]
      limit_overrides:
          compile_timeout: 20000
          compile_cpu_time: 20000
    - language: fortran
      aliases: [fortran, f90]
build: |
    if [[ -d "bin" ]]; then exit 0; fi
    PREFIX=$(realpath $(dirname $0))

    mkdir -p build obj

    cd build

    curl "https://ftp.gnu.org/gnu/gcc/gcc-15.3.0/gcc-15.3.0.tar.gz" -o gcc.tar.gz

    tar xzf gcc.tar.gz --strip-components=1

    ./contrib/download_prerequisites

    cd ../obj

    # No d front end here, unlike gcc/10.2.0: from GCC 12 onward it is written in D
    # and needs an existing GDC to bootstrap, which the buster builder does not have.
    # gcc/10.2.0 stays the provider for the d language.
    # --disable-libsanitizer: buster's binutils cannot link libhwasan from a
    # gcc this new - `ld: final link failed: nonrepresentable section on
    # output` - and bumping binutils would mean moving off buster, which every
    # other package is prebuilt against. The cost is that this gcc has no
    # -fsanitize=address/undefined/thread; it compiles everything else normally.
    ../build/configure --prefix "$PREFIX" --enable-languages=c,c++,fortran --disable-multilib --disable-bootstrap --disable-libsanitizer

    make -j$(nproc)
    make install -j$(nproc)
    cd ../
    rm -rf build obj
env:
    PATH: '{pkgdir}/bin:{PATH}'
    LD_LIBRARY_PATH: '"{pkgdir}/lib:{pkgdir}/lib64" # Need this to properly link Fortran'
compile: |
    # Piston passes every code file. Files submitted without a name arrive as
    # fileN.code; named ones keep whatever the client sent, so only append an
    # extension when the file does not already have the right one. (gcc/10.2.0 used
    # `rename 's/$/\.c/'`, which turns a client-supplied main.c into main.c.c.)
    add_ext() {
        local ext=$1
        shift
        for file in "$@"; do
            [[ "$file" == *".$ext" ]] || mv -- "$file" "${file%.code}.$ext"
        done
    }

    case "${PISTON_LANGUAGE}" in
        c)
            add_ext c "$@"
            gcc -std=c17 -O2 *.c -lm -o a.out
            ;;
        c++)
            add_ext cpp "$@"
            g++ -std=c++23 -O2 *.cpp -o a.out
            ;;
        fortran)
            add_ext f90 "$@"
            gfortran -O2 *.f90 -o a.out
            ;;
        *)
            echo "Unsupported language for this package: ${PISTON_LANGUAGE}" >&2
            exit 1
            ;;
    esac

    chmod +x a.out
run: |
    shift # Discard main filename
    ./a.out "$@"
test:
    language: c
    expect: OK
    source: |
        #include <stdio.h>

        int main(void) {
            printf("OK");
            return 0;
        }
