language: husk
version: '1.0.0'
aliases: []
build: |
    # --- inlined from the former haskell package, at the 8.10.7 that husk
    # needs; it used to copy that build.sh and sed the version in place ---
    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build

    # Platform specific because a true source compile would require GHC to be installed already on the latest
    curl -L "https://downloads.haskell.org/~ghc/8.10.7/ghc-8.10.7-x86_64-deb10-linux.tar.xz" -o ghc.tar.xz
    tar xf ghc.tar.xz --strip-components=1
    rm ghc.tar.xz

    ./configure --prefix="$PREFIX"
    make install -j$(nproc)

    cd ../

    rm -rf build
    # --- end of haskell 8.10.7 ---

    # compile Husk from source
    git clone -q "https://github.com/barbuz/husk.git"
    cd husk
    ../bin/ghc -O2 Husk

    # cleanup
    cd ..
env:
    PATH: '{pkgdir}/bin:{PATH}'
    HUSK_PATH: '{pkgdir}/husk'
    LANG: en_US.UTF8
run: |
    # Store the current path because we'll need it to run the program file
    PROGRAM_PATH=$PWD

    # For now, Husk can only be run within the folder that has the imported modules
    cd $HUSK_PATH

    # Run Husk from file in unicode format with the given args
    ./Husk -uf "${PROGRAM_PATH}/${@}"
test:
    language: husk
    expect: OK
    source: '"OK'
