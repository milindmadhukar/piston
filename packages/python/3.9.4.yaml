language: python
version: '3.9.4'
aliases: [py, py3, python3]
build: |
    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build

    curl "https://www.python.org/ftp/python/3.9.4/Python-3.9.4.tgz" -o python.tar.gz
    tar xzf python.tar.gz --strip-components=1
    rm python.tar.gz

    ./configure --prefix "$PREFIX" --with-ensurepip=install
    make -j$(nproc)
    make install -j$(nproc)

    cd ..

    rm -rf build 

    bin/pip3 install --prefer-binary numpy scipy pandas pycrypto whoosh bcrypt passlib sympy
env:
    PATH: '{pkgdir}/bin:{PATH}'
run: |
    python3.9 "$@"
test:
    language: py
    expect: OK
    source: |
        execute = (execute_with := lambda *a, **k: lambda f: f(*a, **k))()


        @int
        @execute
        class n: __int__ = lambda _: 69


        @execute
        class cout: __lshift__ = print


        @execute_with(n)
        def output(n):
            return "OK"


        cout << output
