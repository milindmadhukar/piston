language: python
version: '3.5.10'
aliases: [py, py3, python3]
build: |
    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build

    curl "https://www.python.org/ftp/python/3.5.10/Python-3.5.10.tgz" -o python.tar.gz
    tar xzf python.tar.gz --strip-components=1
    rm python.tar.gz

    ./configure --prefix "$PREFIX" --with-ensurepip=install
    make -j$(nproc)
    make install -j$(nproc)

    cd ..

    rm -rf build 

    bin/pip3 install --prefer-binary numpy scipy pandas pycrypto whoosh bcrypt passlib
env:
    PATH: '{pkgdir}/bin:{PATH}'
run: |
    python3.5 "$@"
test:
    language: py
    expect: OK
    source: print("OK")
