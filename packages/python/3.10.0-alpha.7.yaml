language: python
version: 3.10.0-alpha.7
aliases: [py, py3, python3]
build: |
    PREFIX=$(realpath $(dirname $0))

    mkdir -p build

    cd build

    curl "https://www.python.org/ftp/python/3.10.0/Python-3.10.0a7.tgz" -o python.tar.gz
    tar xzf python.tar.gz --strip-components=1
    rm python.tar.gz

    ./configure --prefix "$PREFIX" --with-ensurepip=install
    make -j$(nproc)
    make install -j$(nproc)

    cd ..

    rm -rf build 

    # This is alpha version, hence most of the libraries are not compatible with python3.10.0
    # bin/pip3 install --prefer-binary numpy scipy pandas pycrypto whoosh bcrypt passlib
env:
    PATH: '{pkgdir}/bin:{PATH}'
run: |
    python3.10 "$@"
test:
    language: py
    expect: OK
    source: |
        working = True

        match working:
            case True:
                print("OK")
            case False:
                print()
