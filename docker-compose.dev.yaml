version: '3.2'

services:
    # The default runtime image. Packages whose manifest declares a prebuilt
    # archive install straight from upstream, so most development needs nothing
    # else running.
    api:
        build:
            context: .
            dockerfile: api/Dockerfile
            # Without this the builder stage, being last, is what gets tagged.
            target: runtime
        container_name: piston_api
        privileged: true
        restart: always
        ports:
            - 2000:2000
        volumes:
            - ./data/piston/packages:/piston/packages

    # The same API plus a toolchain, so it builds a manifest's `build` script
    # itself rather than fetching an archive from the index. Use this when
    # working on a package that compiles from source:
    #   docker compose -f docker-compose.dev.yaml up -d builder
    #   curl -XPOST localhost:2001/api/v2/operations \
    #     -d '{"kind":"install","language":"bash","version":"5.2.0"}'
    builder:
        profiles: [builder]
        build:
            context: .
            dockerfile: api/Dockerfile
            target: builder
        container_name: piston_builder
        privileged: true
        ports:
            - 2001:2000
        volumes:
            - ./data/piston-builder/packages:/piston/packages
