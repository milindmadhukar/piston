version: '3.2'

services:
    api:
        build: api
        container_name: piston_api
        privileged: true
        restart: always
        ports:
            - 2000:2000
        volumes:
            - ./data/piston/packages:/piston/packages
        environment:
            # Defaults to the local repo service for package development. Point
            # it at a published index to install prebuilt runtimes instead:
            #   PISTON_REPO_URL=https://github.com/engineer-man/piston/releases/download/pkgs/index docker compose -f docker-compose.dev.yaml up -d api
            - PISTON_REPO_URL=${PISTON_REPO_URL:-http://repo:8000/index}

    repo: # Local testing of packages
        build: repo
        container_name: piston_repo
        command: ['--no-build'] # Don't build anything
        volumes:
            - .:/piston
