name: 'Package Pull Requests'

# Validation is the gate now, not a build. A package manifest that declares a
# prebuilt archive is checked by parsing it and verifying the published sha256 -
# seconds, not the hour a container build used to take. Only manifests that
# genuinely need a toolchain get built.

on:
    pull_request:
        types: [opened, reopened, synchronize]
        paths:
            - 'packages/**'
            - 'api/src/manifest.ts'
            - '.github/scripts/**'
            - '.github/workflows/package-pr.yaml'

jobs:
    validate:
        name: Validate manifests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3'

            - name: Install api dependencies
              run: bun install --frozen-lockfile
              working-directory: api

            # Parses every manifest, rejects unknown keys, unpinned sources, a
            # language that disagrees with its directory, and a readme missing a
            # supported language.
            - name: Validate every manifest
              run: bun run tools/validate-manifests.ts
              working-directory: api

            - name: Select changed packages
              id: changed
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  slugs=$(.github/scripts/changed-packages.sh diff "$BASE" "$HEAD")
                  echo "Changed: $slugs"
                  echo "slugs=$(echo $slugs | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

                  json=$(printf '%s\n' "$slugs" | jq -R . | jq -sc 'map(select(length > 0))')
                  echo "matrix=$json" >> "$GITHUB_OUTPUT"
                  if [ "$json" = "[]" ]; then
                    echo "any=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "any=true" >> "$GITHUB_OUTPUT"
                  fi

            # Downloads each changed package's sources and checks the digest
            # matches. This is what makes a prebuilt manifest trustworthy without
            # ever building it.
            - name: Verify source checksums
              if: steps.changed.outputs.any == 'true'
              run: bun run tools/validate-manifests.ts --fetch --only ${{ steps.changed.outputs.slugs }}
              working-directory: api

        outputs:
            matrix: ${{ steps.changed.outputs.matrix }}
            any: ${{ steps.changed.outputs.any }}

    build:
        name: Build ${{ matrix.slug }}
        needs: validate
        if: needs.validate.outputs.any == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 360
        strategy:
            fail-fast: false
            max-parallel: 4
            matrix:
                slug: ${{ fromJSON(needs.validate.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v4

            # Prebuilt packages have nothing to build; the checksum check above
            # is the whole gate for them.
            - name: Does this package need a build?
              id: needs
              run: |
                  if grep -qE '^(build|post_install):' \
                       "packages/${slug%%-*}/${slug#*-}.yaml"; then
                    echo "build=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "build=false" >> "$GITHUB_OUTPUT"
                    echo "${{ matrix.slug }} is prebuilt; nothing to build"
                  fi
              env:
                  slug: ${{ matrix.slug }}

            - name: Build ${{ matrix.slug }}
              if: steps.needs.outputs.build == 'true'
              run: .github/scripts/build-package.sh '${{ matrix.slug }}'

            - name: Upload package as artifact
              if: steps.needs.outputs.build == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: packages-${{ matrix.slug }}
                  path: packages/${{ matrix.slug }}.pkg.tar.gz

    test:
        name: Test ${{ matrix.slug }}
        needs: [validate, build]
        if: needs.validate.outputs.any == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                slug: ${{ fromJSON(needs.validate.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3'

            - uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  name: packages-${{ matrix.slug }}
                  path: packages

            # Installs the package on a real instance and runs the manifest's
            # own `test` block through it.
            - name: Run the package's test
              run: .github/scripts/test-package.sh '${{ matrix.slug }}'
